apiVersion: apps/v1
kind: Deployment
metadata: { name: apiseclint, labels: { app: apiseclint } }
spec:
  replicas: 1
  selector: { matchLabels: { app: apiseclint } }
  template:
    metadata: { labels: { app: apiseclint } }
    spec:
      containers:
        - name: apiseclint
          image: ghcr.io/cognis-digital/apiseclint:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: apiseclint }
spec:
  selector: { app: apiseclint }
  ports: [{ port: 80, targetPort: 8000 }]
